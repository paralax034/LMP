name: CI

on:
    push:
        branches: [main, avalonia]
    pull_request:

jobs:
    build:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "11.0.x"
                  cache: true
                  cache-dependency-path: "**/packages.lock.json"

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Validate Localization Integrity
              run: python Tools/audit_l10n.py

            - name: Restore Dependencies
              run: dotnet restore --force-evaluate

            - name: Build Debug
              run: ./build.bat debug nopause

            - name: Build Optimized Debug
              run: ./build.bat optimized nopause

            - name: Validate Native AOT Publish
              run: ./build.bat publish nopause
