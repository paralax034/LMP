name: Dev Build

on:
    push:
        branches: [main, avalonia]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: recursive

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "11.0.x"
                  cache: true
                  cache-dependency-path: "**/packages.lock.json"

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Validate Localization Integrity
              run: python Tools/audit_l10n.py

            # Version Computation (Commit count + short hash)
            - name: Compute Git Version Info
              id: version
              shell: pwsh
              run: |
                  $commitCount = git rev-list --count HEAD
                  $shortHash = git rev-parse --short=7 HEAD
                  $fullVersion = "${commitCount}-${shortHash}"

                  echo "VERSION=$commitCount" >> $env:GITHUB_ENV
                  echo "FULL_VERSION=$fullVersion" >> $env:GITHUB_ENV
                  echo "COMMIT_HASH=$shortHash" >> $env:GITHUB_ENV
                  echo "COMMIT_COUNT=$commitCount" >> $env:GITHUB_ENV

                  Write-Host "Version: v$fullVersion"

            # 7-Zip Setup
            - name: Setup 7-Zip
              uses: milliewalky/setup-7-zip@v2

            # Compilation
            - name: Build Debug
              run: ./build.bat debug nopause

            - name: Build Release (Native AOT Publish)
              run: ./build.bat publish nopause

            # Archiving
            - name: Archive Debug Build
              shell: pwsh
              run: |
                  $debugPath = "bin/Debug/net11.0"
                  if (-not (Test-Path $debugPath)) {
                    Write-Error "Debug build folder not found at $debugPath"
                    exit 1
                  }
                  7z a -t7z -m0=lzma2 -mx=5 -md=16m -ms=on "LMP-Debug-v${{ env.FULL_VERSION }}.7z" "$debugPath/*"
                  Write-Host "Created: LMP-Debug-v${{ env.FULL_VERSION }}.7z"

            - name: Archive Release Build
              shell: pwsh
              run: |
                  if (-not (Test-Path "publish")) {
                    Write-Error "Publish folder not found!"
                    exit 1
                  }
                  7z a -t7z -m0=lzma2 -mx=9 -md=64m -ms=on "LMP-Release-v${{ env.FULL_VERSION }}.7z" "publish/*"
                  Write-Host "Created: LMP-Release-v${{ env.FULL_VERSION }}.7z"

            # Actions Artifacts
            - name: Upload Debug Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: LMP-Debug-v${{ env.FULL_VERSION }}
                  path: LMP-Debug-v${{ env.FULL_VERSION }}.7z

            - name: Upload Release Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: LMP-Release-v${{ env.FULL_VERSION }}
                  path: LMP-Release-v${{ env.FULL_VERSION }}.7z

            # Cleanup Obsolete Dev Assets
            - name: Delete Old Dev Assets
              uses: mknejp/delete-release-assets@v1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  tag: dev
                  assets: |
                      LMP-Debug-*.7z
                      LMP-Release-*.7z
                  fail-if-no-release: false

            # Create/Update Dev Snapshot Release
            - name: Create/Update Dev Pre-release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: dev-${{ env.COMMIT_COUNT }}
                  name: "Dev Build v${{ env.FULL_VERSION }}"
                  prerelease: true
                  make_latest: false
                  fail_on_unmatched_files: true
                  files: |
                      LMP-Debug-v${{ env.FULL_VERSION }}.7z
                      LMP-Release-v${{ env.FULL_VERSION }}.7z
                  body: |
                      **Automated Snapshot Dev Build**

                      | Parameter | Value |
                      |---|---|
                      | Version | `v${{ env.FULL_VERSION }}` |
                      | Architecture | Native AOT (win-x64) |
                      | Release Tag | `dev-${{ env.COMMIT_COUNT }}` |
                      | Commit SHA | `${{ env.COMMIT_HASH }}` |
                      | Total Commits | ${{ env.COMMIT_COUNT }} |
                      | Branch | `${{ github.ref_name }}` |
                      | Built At | ${{ github.event.head_commit.timestamp }} |

                      ⚠️ **Testing pre-release build — not intended for production usage.**

                      ### Downloads
                      - **[LMP-Release-v${{ env.FULL_VERSION }}.7z](https://github.com/${{ github.repository }}/releases/download/dev-${{ env.COMMIT_COUNT }}/LMP-Release-v${{ env.FULL_VERSION }}.7z)** — Native AOT Standalone (Recommended)
                      - [LMP-Debug-v${{ env.FULL_VERSION }}.7z](https://github.com/${{ github.repository }}/releases/download/dev-${{ env.COMMIT_COUNT }}/LMP-Debug-v${{ env.FULL_VERSION }}.7z) — Debug build with logging console
